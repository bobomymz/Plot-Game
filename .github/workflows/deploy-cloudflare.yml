name: Deploy to Cloudflare Pages

# push 到 main 自动构建并上线；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 连续推送只保留最新一次部署，避免旧构建覆盖新构建
concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # tools/build-dist.mjs 只用 node 内置模块，无需 npm install
      - name: Build dist/
        run: node tools/build-dist.mjs

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shichao-biji --branch=main
