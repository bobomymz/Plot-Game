<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>夜晚效果极简版</title>
    <style>
        body {
            background-color: #0b0f15;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .night-image {
            max-width: 90vw;
            height: auto;
            /* 直接对图片本身使用滤镜，不搞任何复杂容器 */
            filter: brightness(0.5) contrast(1.3) saturate(0.8) hue-rotate(180deg);
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- 直接给图片加 class，外面没有任何包裹的 div -->
    <img class="night-image" src="小区内部.jpg" alt="夜晚丧尸街道">

</body>
</html>
